name: package-and-test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      COLORPIPE_TEST_INSTALLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel from sdist
        run: |
          python -m pip install -r requirements-build.txt
          python -m build --no-isolation
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'twine', 'check', '--strict', *glob.glob('dist/*')])"
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, 'tools/validate_distribution.py', *glob.glob('dist/*'), '--report', 'out/distribution-validation.json'])"
      - name: Install and test wheel
        run: |
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0] + '[dev]'])"
          python -m pip check
          python -I -c "import colorpipe; assert 'site-packages' in colorpipe.__file__; print(colorpipe.__file__)"
          python -I -m colorpipe --version
          orf2dng --help
          python -c "import tarfile; tarfile.open('dist/colorpipe-0.1.0.tar.gz').extractall('.cache/sdist', filter='data')"
          python -c "import subprocess, sys; subprocess.check_call([sys.executable, '-I', '-m', 'pytest', '-q', '--ignore=tests/integration', '--basetemp=.cache/pytest'], cwd='.cache/sdist/colorpipe-0.1.0')"
